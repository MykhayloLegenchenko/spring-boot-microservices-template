spring:
  threads:
    virtual:
      enabled: true

  web:
    locale-resolver: fixed
    locale: en_US

  cloud:
    refresh:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health, info

  endpoint:
    health:
      probes:
        enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${services.discovery}/eureka

    healthcheck:
      enabled: true

    instance-info-replication-interval-seconds: 10
    registry-fetch-interval-seconds: 10

  instance:
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15

auth:
  jwt:
    issuer: https://example.com

otel:
  metrics:
    exporter: otlp

  traces:
    exporter: otlp
    sampler: exclude

  logs:
    exporter: otlp

  propagators:
    - tracecontext
    - baggage

  exporter:
    otlp:
      protocol: grpc

  java:
    disabled:
      resource:
        providers:
          - io.opentelemetry.instrumentation.resources.ContainerResourceProvider
          - io.opentelemetry.instrumentation.resources.HostResourceProvider
          - io.opentelemetry.instrumentation.resources.OsResourceProvider
          - io.opentelemetry.instrumentation.resources.ProcessResourceProvider
          - io.opentelemetry.instrumentation.resources.ProcessRuntimeResourceProvider

  exclude-sampler:
    server:
      paths: /actuator/(.*)?;/;/favicon.ico
    client:
      hosts: config-service;discovery-service;localhost
      paths: /actuator/(.*)?

logging:
  include-application-name: false
  pattern:
    correlation: "[${spring.application.name:},%X{trace_id:-},%X{span_id:-},%X{trace_flags:-}]"

  level:
    com.netflix.discovery.eureka: WARN
    com.example.common.opentelemetty.ExcludeSampler: WARN

---
spring:
  config:
    activate:
      on-profile: "no-discovery"

  cloud:
    discovery:
      enabled: false
