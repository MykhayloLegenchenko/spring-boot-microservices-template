spring:
  cloud:
    config:
      enabled: false

auth:
  jwt:
    access-token:
      secret: your-access-secret

services:
  discovery: http://localhost:8761
  user: http://localhost:8081
  weather: http://localhost:8082

otel:
  exporter:
    otlp:
      endpoint: http://localhost:4317

logging:
  level:
    io.opentelemetry.exporter.internal.grpc.GrpcExporter: OFF
