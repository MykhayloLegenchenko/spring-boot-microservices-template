spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      server:
        webflux:
          routes:
            # user-service
            - id: user_route
              uri: ${services.user}
              predicates:
                - Path=/api/v1/{dir:auth|roles|users}/**

            - id: user_openapi_route
              uri: ${services.user}
              predicates:
                - Path=/swagger-ui.html, /swagger-ui/**, /v3/api-docs.yaml, /v3/api-docs/**
              filters:
                - RewritePath=/users/?(?<segment>.*), /$\{segment}

            # weather-service
            - id: weather_route
              uri: ${services.weather}
              predicates:
                - Path=/api/v1/weather/**

            - id: weather_openapi_route
              uri: ${services.weather}
              predicates:
                - Path=/swagger-ui.html, /swagger-ui/**, /v3/api-docs.yaml, /v3/api-docs/**
              filters:
                - RewritePath=/users/?(?<segment>.*), /$\{segment}

services:
  user: lb://user-service
  weather: lb://weather-service
