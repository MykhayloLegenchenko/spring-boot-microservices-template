spring:
  datasource:
    url: jdbc:mysql://mysql:3306/users
    username: user
    password: password

  security:
    oauth2:
      client:
        registration:
          google:
            clientId: your-google-client-id
            clientSecret: your-google-client-secret

auth:
  jwt:
    access-token:
      secret: your-access-secret
      ttl: 43200

    refresh-token:
      secret: your-refresh-secret
      ttl: 86400
