/**
 * Base configuration for microservices.
 */

//file:noinspection GrUnresolvedAccess
apply plugin: 'org.springframework.boot'
apply plugin: 'io.spring.dependency-management'

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

dependencies {
    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Project dependencies
    implementation project(':common-lib')
    implementation project(':autoconfiguration')
    testImplementation project(':test-lib')

    // OpenTelemetry
    implementation platform("io.opentelemetry.instrumentation:opentelemetry-instrumentation-bom:${opentelemetryInstrumentationVersion}")
    implementation 'io.opentelemetry.instrumentation:opentelemetry-spring-boot-starter'

    // MapStruct
    implementation "org.mapstruct:mapstruct:${mapstructVersion}"

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}
