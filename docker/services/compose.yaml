services:
  # Users service
  users-service:
    container_name: users-service
    build:
      context: ../..
      dockerfile: docker/services/Dockerfile
      args:
        GROUP: 'services'
        SERVICE: 'users/service'
    ports:
      - '8081:8080'
    networks:
      - template-network
    depends_on:
      broker:
        condition: service_started
      mysqldb:
        condition: service_started
      discovery:
        condition: service_healthy
      observability:
        condition: service_started

  # Weather service
  weather-service:
    container_name: weather-service
    build:
      context: ../..
      dockerfile: docker/services/Dockerfile
      args:
        GROUP: 'services'
        SERVICE: 'weather/service'
    ports:
      - '8082:8080'
    networks:
      - template-network
    depends_on:
      discovery:
        condition: service_healthy
      observability:
        condition: service_started
