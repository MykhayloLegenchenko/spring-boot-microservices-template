services:
  mysql:
    container_name: mysql
    image: mysql:9.3
    environment:
      MYSQL_USER: 'user'
      MYSQL_PASSWORD: 'password'
      MYSQL_ROOT_PASSWORD: 'root'
    ports:
      - '3306:3306'
    volumes:
      - mysql:/var/lib/mysql
      - ./initdb:/docker-entrypoint-initdb.d
    networks:
      - template-network

volumes:
  mysql:
